<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A quiet, notebook-style strength training log.">
  <title>Liftbook — Weight log</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a44'/%3E%3Cpath d='M7 13h3v6H7zm15 0h3v6h-3zM5 14h2v4H5zm20 0h2v4h-2zm5-1h-3v6h3zM10 15h12v2H10z' fill='%23f7f4ec'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f4ec;
      --paper-deep: #efebe1;
      --ink: #1f2a44;
      --ink-soft: #6a6d74;
      --rule: #c8c4ba;
      --rule-light: #ddd9cf;
      --red: #b84b40;
      --red-dark: #94392f;
      --green: #366a53;
      --white: #fffef9;
      --shadow: 0 18px 50px rgba(31, 42, 68, 0.08);
    }

    * { box-sizing: border-box; }

    html { background: #dad7d0; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,.24), rgba(255,255,255,.24)),
        #dad7d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(184, 75, 64, 0.28);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      min-height: calc(100vh - 32px);
      margin: 16px auto;
      background:
        linear-gradient(90deg, transparent 0 57px, rgba(184,75,64,.13) 57px 58px, transparent 58px),
        repeating-linear-gradient(0deg, transparent 0 31px, rgba(66,80,110,.075) 31px 32px),
        var(--paper);
      border: 1px solid #cbc6bb;
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 76px;
      padding: 0 28px 0 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 2px solid var(--ink);
      background: rgba(247, 244, 236, .94);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.65rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .brand .date {
      color: var(--ink-soft);
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    .privacy-badge {
      min-height: 42px;
      padding: 8px 12px;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      background: rgba(255,255,255,.3);
      border: 1px solid var(--rule);
      border-radius: 3px;
    }

    .lock-icon { font-size: 1rem; vertical-align: -1px; }

    .workspace {
      padding: 32px 28px 40px 76px;
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .tabs { display: flex; gap: 24px; }

    .tab {
      position: relative;
      padding: 5px 0 9px;
      color: var(--ink-soft);
      background: transparent;
      border: 0;
      font-size: .83rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .tab[aria-selected="true"] { color: var(--ink); }
    .tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--red);
    }

    .session-note {
      color: var(--ink-soft);
      font-size: .82rem;
    }

    .today-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr);
      gap: 48px;
      align-items: start;
    }

    .entry-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--red);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .exercise-select {
      max-width: 100%;
      padding: 0 30px 5px 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--ink);
      border-radius: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .equipment-toggle {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 3px;
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.42);
    }

    .equipment-toggle button {
      min-height: 34px;
      padding: 5px 10px;
      color: var(--ink-soft);
      background: transparent;
      border: 0;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .equipment-toggle button[aria-pressed="true"] {
      color: var(--white);
      background: var(--ink);
    }

    .set-list { border-top: 1px solid var(--ink); }

    .set-header,
    .set-row {
      display: grid;
      grid-template-columns: 44px minmax(88px, 1fr) minmax(84px, 1fr) minmax(70px, .8fr) 44px;
      gap: 12px;
      align-items: center;
    }

    .set-header {
      min-height: 42px;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--rule);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .set-row {
      min-height: 64px;
      border-bottom: 1px solid var(--rule-light);
      transition: opacity .16s ease, background .16s ease;
    }

    .set-row.is-complete {
      background: linear-gradient(90deg, rgba(54,106,83,.06), transparent 70%);
    }

    .set-number {
      color: var(--ink-soft);
      font-weight: 700;
      text-align: center;
    }

    .previous { color: var(--ink-soft); font-size: .9rem; }

    .set-input {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 5px 9px;
      color: var(--ink);
      background: rgba(255,255,255,.52);
      border: 1px solid var(--rule);
      border-radius: 2px;
      font-size: 1rem;
      font-weight: 700;
    }

    .set-input::placeholder { color: #aaa79f; font-weight: 400; }

    .complete-button {
      width: 36px;
      height: 36px;
      color: var(--rule);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 50%;
      font-weight: 800;
    }

    .complete-button:hover { color: var(--green); border-color: var(--green); }
    .set-row.is-complete .complete-button {
      color: var(--white);
      background: var(--green);
      border-color: var(--green);
    }

    .entry-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
    }

    .add-set {
      min-height: 42px;
      padding: 8px 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--ink);
      font-weight: 700;
    }

    .primary-button {
      min-height: 46px;
      padding: 10px 18px;
      color: var(--white);
      background: var(--red);
      border: 1px solid var(--red);
      border-radius: 3px;
      font-weight: 700;
    }

    .primary-button:hover { background: var(--red-dark); border-color: var(--red-dark); }

    .save-message {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--green);
      font-size: .84rem;
      font-weight: 700;
      text-align: right;
    }

    .side-notes { display: grid; gap: 30px; }

    .note-block {
      padding-top: 13px;
      border-top: 2px solid var(--ink);
    }

    .note-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .note-heading h2,
    .history-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
    }

    .note-heading span { color: var(--ink-soft); font-size: .75rem; }

    .last-table,
    .history-table { width: 100%; border-collapse: collapse; }

    .last-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--rule-light);
      font-size: .9rem;
    }

    .last-table td:first-child { width: 44px; color: var(--ink-soft); }
    .last-table td:last-child { text-align: right; font-weight: 700; }

    .best-line {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 0;
      font-size: .83rem;
    }

    .best-line span:first-child { color: var(--ink-soft); }

    .chart-wrap {
      position: relative;
      height: 150px;
      margin-top: 10px;
      overflow: hidden;
      border-left: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      background: repeating-linear-gradient(0deg, transparent 0 28px, rgba(66,80,110,.08) 28px 29px);
    }

    .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .chart-labels { display: flex; justify-content: space-between; margin-top: 7px; color: var(--ink-soft); font-size: .7rem; }

    .history-view[hidden], .today-view[hidden] { display: none; }

    .history-view {
      max-width: 820px;
      margin: 0 auto;
    }

    .history-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .history-intro .history-title { font-size: clamp(1.8rem, 4vw, 2.5rem); }

    .history-table th,
    .history-table td {
      padding: 15px 10px;
      border-bottom: 1px solid var(--rule);
      text-align: left;
    }

    .history-table th {
      color: var(--ink-soft);
      font-size: .74rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .history-table td:nth-child(3),
    .history-table td:nth-child(4),
    .history-table th:nth-child(3),
    .history-table th:nth-child(4) { text-align: right; }

    .history-table td:first-child { color: var(--ink-soft); font-size: .82rem; }
    .history-table td:nth-child(2) { font-weight: 700; }

    .empty-note {
      margin: 16px 0 0;
      color: var(--ink-soft);
      font-size: .86rem;
    }

    .history-empty {
      padding: 28px 10px !important;
      color: var(--ink-soft);
      text-align: center !important;
    }

    .loading-state { opacity: .62; pointer-events: none; }

    .app-status {
      min-height: 20px;
      margin: 0 0 18px;
      color: var(--red);
      font-size: .82rem;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 840px) {
      .app-shell { width: min(100% - 20px, 720px); min-height: calc(100vh - 20px); margin: 10px auto; }
      .topbar { padding-left: 48px; }
      .workspace { padding: 26px 22px 36px 48px; }
      .app-shell {
        background:
          linear-gradient(90deg, transparent 0 31px, rgba(184,75,64,.13) 31px 32px, transparent 32px),
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(66,80,110,.075) 31px 32px),
          var(--paper);
      }
      .today-grid { grid-template-columns: 1fr; gap: 44px; }
      .side-notes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    }

    @media (max-width: 600px) {
      .app-shell { width: 100%; min-height: 100vh; margin: 0; border: 0; box-shadow: none; }
      .topbar { min-height: 68px; padding: 0 16px 0 28px; }
      .brand { gap: 9px; }
      .brand .date { display: none; }
      .privacy-badge .button-label { display: none; }
      .workspace { padding: 22px 16px 92px 28px; }
      .page-nav { align-items: flex-start; margin-bottom: 24px; }
      .tabs { gap: 20px; }
      .session-note { max-width: 110px; text-align: right; }
      .entry-head { display: block; margin-bottom: 22px; }
      .exercise-select { width: 100%; font-size: 1.8rem; }
      .equipment-toggle { margin-top: 16px; }
      .set-header,
      .set-row { grid-template-columns: 30px 70px minmax(64px, 1fr) minmax(58px, .78fr) 38px; gap: 7px; }
      .set-header { font-size: .66rem; }
      .previous { font-size: .78rem; }
      .set-input { height: 40px; padding: 4px 7px; }
      .entry-actions { align-items: flex-end; }
      .primary-button { padding-inline: 14px; }
      .side-notes { grid-template-columns: 1fr; }
      .history-intro { display: block; }
      .history-intro .equipment-toggle { margin-top: 18px; }
      .history-table th:nth-child(1),
      .history-table td:nth-child(1) { display: none; }
      .history-table th,
      .history-table td { padding: 13px 6px; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Liftbook</h1>
        <span class="date">Wed · Sep 16</span>
      </div>
      <div class="top-actions">
        <span class="privacy-badge" aria-label="Password protected">
          <span class="lock-icon" aria-hidden="true">▣</span>
          <span class="button-label"> Private</span>
        </span>
      </div>
    </header>

    <div class="workspace">
      <div class="page-nav">
        <div class="tabs" role="tablist" aria-label="Liftbook views">
          <button class="tab" id="todayTab" type="button" role="tab" aria-selected="true" aria-controls="todayView">Today</button>
          <button class="tab" id="historyTab" type="button" role="tab" aria-selected="false" aria-controls="historyView">History</button>
        </div>
        <span class="session-note" id="sessionNote">Loading…</span>
      </div>

      <p class="app-status" id="appStatus" aria-live="polite"></p>

      <section class="today-view" id="todayView" role="tabpanel" aria-labelledby="todayTab">
        <div class="today-grid">
          <section class="entry-panel" aria-labelledby="exerciseLabel">
            <div class="entry-head">
              <div>
                <p class="eyebrow" id="exerciseLabel">Log an exercise</p>
                <label class="sr-only" for="exerciseSelect">Exercise</label>
                <input class="exercise-select" id="exerciseSelect" list="exerciseSuggestions" value="Bench press" autocomplete="off" maxlength="100">
                <datalist id="exerciseSuggestions">
                  <option value="Bench press"></option>
                  <option value="Back squat"></option>
                  <option value="Romanian deadlift"></option>
                  <option value="Dumbbell row"></option>
                  <option value="Overhead press"></option>
                  <option value="Dumbbell bench press"></option>
                  <option value="Dumbbell shoulder press"></option>
                  <option value="Barbell row"></option>
                </datalist>
              </div>
              <div class="equipment-toggle" aria-label="Equipment">
                <button type="button" aria-pressed="true" data-equipment="Barbell">Barbell</button>
                <button type="button" aria-pressed="false" data-equipment="Dumbbell">DB</button>
              </div>
            </div>

            <div class="set-list" id="setList">
              <div class="set-header" aria-hidden="true">
                <span>Set</span>
                <span>Last</span>
                <span>Weight</span>
                <span>Reps</span>
                <span>Done</span>
              </div>
            </div>

            <div class="entry-actions">
              <button class="add-set" id="addSetButton" type="button">+ Add set</button>
              <button class="primary-button" id="saveButton" type="button">Save exercise</button>
            </div>
            <p class="save-message" id="saveMessage" aria-live="polite"></p>
          </section>

          <aside class="side-notes" aria-label="Exercise notes and history">
            <section class="note-block">
              <div class="note-heading">
                <h2>Last time</h2>
                <span id="lastDate">—</span>
              </div>
              <table class="last-table" aria-label="Sets from last time">
                <tbody id="lastSets"></tbody>
              </table>
              <p class="empty-note" id="lastEmpty">No earlier sets for this exercise.</p>
              <p class="best-line" id="bestLine" hidden><span>Best set</span><strong id="bestSet"></strong></p>
            </section>

            <section class="note-block">
              <div class="note-heading">
                <h2>Recent top sets</h2>
                <span>8 weeks</span>
              </div>
              <div class="chart-wrap" id="chartWrap" aria-label="No recent top sets yet">
                <svg viewBox="0 0 300 145" role="img" aria-labelledby="chartTitle chartDesc" preserveAspectRatio="none">
                  <title id="chartTitle">Top set trend</title>
                  <desc id="chartDesc">No recent top sets yet.</desc>
                  <g id="chartMarks"></g>
                </svg>
              </div>
              <div class="chart-labels" id="chartLabels" aria-hidden="true"><span>—</span><span>—</span></div>
            </section>
          </aside>
        </div>
      </section>

      <section class="history-view" id="historyView" role="tabpanel" aria-labelledby="historyTab" hidden>
        <div class="history-intro">
          <div>
            <p class="eyebrow">Training log</p>
            <h2 class="history-title">Recent lifts</h2>
          </div>
          <div class="equipment-toggle" aria-label="History period">
            <button type="button" aria-pressed="true">8 weeks</button>
            <button type="button" aria-pressed="false">All</button>
          </div>
        </div>
        <table class="history-table">
          <thead><tr><th>Date</th><th>Exercise</th><th>Top set</th><th>Sets</th></tr></thead>
          <tbody id="historyRows"><tr><td class="history-empty" colspan="4">No lifts logged yet.</td></tr></tbody>
        </table>
      </section>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
